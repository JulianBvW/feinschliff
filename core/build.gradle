plugins {
	id 'java-library'
}

// Deliberately no Loom and no Minecraft dependency. This module must stay
// compilable on its own -- that is what keeps the version-specific adapters
// thin and makes porting to another Minecraft version cheap.
repositories {
	mavenCentral()
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 8
}
