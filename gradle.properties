# --- Gradle ---------------------------------------------------------------
org.gradle.jvmargs = -Xmx2G
org.gradle.parallel = true

# --- Mod ------------------------------------------------------------------
mod_version         = 0.1.0
maven_group         = io.github.julianbvw
archives_base_name  = feinschliff

# --- Build plugins --------------------------------------------------------
# Pinned on purpose. Ornithe is a volunteer project and mapping names can move
# between builds; nothing here updates by itself.
loom_version        = 1.17.20
ploceus_version     = 1.17.7

# --- Minecraft / Ornithe --------------------------------------------------
# Current versions: https://ornithemc.net/develop
minecraft_version   = a1.1.2_01
loader_version      = 0.19.5

# The version predicate that goes into fabric.mod.json. It must match what
# Fabric Loader reports at runtime, which is NOT what ploceus.normalized-
# MinecraftVersion() returns -- the two normalize differently:
#   a1.1.2_01  ->  loader 1.0.0-alpha.1.2.1   ploceus 1.0.0-alpha.1.1.2.1
# Read the value off the "Loading N mods: ... minecraft <version>" line in the
# game log when adding a new Minecraft version.
minecraft_predicate = 1.0.0-alpha.1.2.1

# OSL is not used yet. The mod bootstraps itself from a Minecraft.init() mixin.
# If a feature needs OSL later: osl_version = 0.22.0-alpha.3

feather_build       = 2
raven_build         = 2
sparrow_build       = 2
nests_build         = 5

